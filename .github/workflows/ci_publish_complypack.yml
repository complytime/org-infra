# Publish Complypack — Ampel Branch Protection
# ==============================================
# Dual-registry publish pipeline for the Ampel branch-protection complypack.
#
# Push to main (policy path change):
#   1. prepare      — computes publish parameters (tag, version, attestation policy)
#   2. publish-ghcr — packs and pushes the complypack OCI artifact to GHCR
#                     (tag_override tag, or sha-<commit> when not specified)
#   3. sign-ghcr    — signs the GHCR artifact with Sigstore keyless signing
#
# workflow_dispatch (promote_quay=false):
#   Same as push-to-main flow (prepare → publish-ghcr → sign-ghcr).
#
# workflow_dispatch (promote_quay=true, from a tag):
#   1. prepare      — derives tag and version from the release tag
#   2. publish-ghcr — rebuilds the complypack from the release commit and
#                     pushes to GHCR with the release tag and forced attestations
#   3. sign-ghcr    — signs the GHCR artifact
#   4. promote-quay — promotes the signed GHCR artifact to Quay.io
#
# Release-triggered promotion removed — use workflow_dispatch with
# promote_quay=true from a tag ref instead. App token automation for
# release-triggered promotion is a follow-up.

name: Publish Complypack (Ampel Branch Protection)

on:
  push:
    branches:
      - main
    paths:
      - "compliance/ampel/branch-protection/**"
  # Release-triggered promotion removed — use
  # workflow_dispatch with promote_quay=true from a tag ref instead.
  # See non-goal: App token automation is a follow-up.
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Custom tag (leave empty for default sha-<commit>)"
        required: false
        type: string
      promote_quay:
        description: "Rebuild and publish to GHCR, then promote to Quay"
        required: false
        default: false
        type: boolean
      release_tag:
        description: >-
          Quay destination tag (required when promote_quay is true,
          e.g., v0.4.0). Defaults to github.ref_name when dispatched
          from a tag.
        required: false
        type: string

permissions:
  contents: none
  packages: none
  id-token: none
  attestations: none
  actions: none

concurrency:
  group: ci-complypack-ampel-bp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      complypack_version: ${{ steps.compute.outputs.complypack_version }}
      generate_attestations: ${{ steps.compute.outputs.generate_attestations }}
      release_tag: ${{ steps.compute.outputs.release_tag }}
    steps:
      - name: Compute publish parameters
        id: compute
        env:
          PROMOTE_QUAY: ${{ inputs.promote_quay }}
          TAG_OVERRIDE: ${{ inputs.tag_override }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$PROMOTE_QUAY" == "true" ]]; then
            if [[ "$REF_TYPE" == "tag" ]]; then
              TAG="${REF_NAME}"
              DEST_TAG="${RELEASE_TAG:-${REF_NAME}}"
            elif [[ -n "$RELEASE_TAG" ]]; then
              TAG="${RELEASE_TAG}"
              DEST_TAG="${RELEASE_TAG}"
            else
              echo "::error::promote_quay requires dispatching from a tag or providing release_tag"
              exit 1
            fi
            VERSION="${TAG#v}"
            ATTESTATIONS="true"
          else
            TAG="${TAG_OVERRIDE:-sha-${GITHUB_SHA}}"
            VERSION="0.0.0-dev"
            ATTESTATIONS="auto"
            DEST_TAG=""
          fi
          {
            echo "tag=${TAG}"
            echo "complypack_version=${VERSION}"
            echo "generate_attestations=${ATTESTATIONS}"
            echo "release_tag=${DEST_TAG}"
          } >> "$GITHUB_OUTPUT"

  publish-ghcr:
    needs: [prepare]
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable_publish_complypack.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      content_path: compliance/ampel/branch-protection
      image_name: complytime/complypack-ampel-branch-protection
      tag: ${{ needs.prepare.outputs.tag }}
      evaluator_id: ampel
      complypack_id: io.complytime.ampel-branch-protection
      complypack_version: ${{ needs.prepare.outputs.complypack_version }}
      go_version: "1.26"
      complypack_cli_ref: "v0.1.0"
      tag_latest: true
      generate_attestations: ${{ needs.prepare.outputs.generate_attestations }}

  sign-ghcr:
    needs: [publish-ghcr]
    if: >-
      always()
      && needs.publish-ghcr.result == 'success'
      && needs.publish-ghcr.outputs.image != ''
      && needs.publish-ghcr.outputs.digest != ''
    uses: ./.github/workflows/reusable_sign_and_verify.yml
    permissions:
      packages: write
      id-token: write
    with:
      image_name: ${{ needs.publish-ghcr.outputs.image }}
      digest: ${{ needs.publish-ghcr.outputs.digest }}
      allowed_identity_regex: https://github.com/complytime/org-infra(/.*)?
      verify_vuln: false

  promote-quay:
    needs: [prepare, sign-ghcr]
    if: >-
      always()
      && needs.sign-ghcr.result == 'success'
      && github.event_name == 'workflow_dispatch'
      && inputs.promote_quay
    uses: ./.github/workflows/reusable_publish_quay.yml
    permissions:
      packages: read
      id-token: write
    with:
      source_registry: ghcr.io
      source_image: complytime/complypack-ampel-branch-protection
      source_tag: ${{ needs.prepare.outputs.tag }}
      dest_registry: quay.io
      dest_image: complytime/complypack-ampel-branch-protection
      dest_tag: ${{ needs.prepare.outputs.release_tag }}
      allowed_identity_regex: https://github.com/complytime/org-infra(/.*)?
      fail_if_dest_exists: true
      include_sha_tags: false
    secrets:
      dest_username: ${{ secrets.QUAY_USERNAME }}
      dest_password: ${{ secrets.QUAY_PASSWORD }}
