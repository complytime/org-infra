# SPDX-License-Identifier: Apache-2.0
#
# Report completed-sprint velocity from the Compliance Automation planning
# board (issues Done per Iteration, then averages across completed sprints).
#
# Uses PROJECT_SYNC_TOKEN (project read). See docs/SPRINT_VELOCITY.md.

name: Report sprint velocity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-sprint-velocity:
    name: Report sprint velocity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout org-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-project-sync.txt

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::PROJECT_SYNC_TOKEN secret is not configured. See docs/PROJECT_BOARD_SYNC.md"
            exit 1
          fi
          python scripts/report-sprint-velocity.py \
            --config project-sync-config.yml \
            --output sprint-velocity.md \
            --json-output sprint-velocity.json
          cat sprint-velocity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sprint-velocity
          path: |
            sprint-velocity.md
            sprint-velocity.json
          if-no-files-found: error
