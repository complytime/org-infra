# Stale Review Alerts
# --------------------------------------------------------------------------
# Scheduled caller: flags PRs with review requests pending beyond a
# configurable business-day threshold. Consumes reusable_stale_reviews.yml.
# --------------------------------------------------------------------------
name: Stale Review Alerts

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 09:00 UTC

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none
  pull-requests: none

jobs:
  call_reusable_stale_reviews:
    name: Stale Review Check
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/reusable_stale_reviews.yml
